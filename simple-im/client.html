<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple IM Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        #status {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
            border-radius: 3px;
        }
        .system { background-color: #e7f3ff; }
        .received { background-color: #fff3cd; }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Simple IM 测试客户端</h1>

    <div id="status" class="disconnected">未连接</div>

    <div id="messages"></div>

    <div>
        <input type="text" id="userId" placeholder="输入用户ID" value="user123" style="width: 200px; padding: 8px;">
        <button onclick="connect()">连接</button>
        <button onclick="disconnect()">断开</button>
    </div>

    <script>
        let ws = null;
        let heartbeatTimer = null;
        let userId = '';

        function addMessage(text, type = 'system') {
            const messagesDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + type;
            msgDiv.textContent = new Date().toLocaleTimeString() + ' - ' + text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusDiv = document.getElementById('status');
            if (connected) {
                statusDiv.textContent = '已连接 - 用户: ' + userId;
                statusDiv.className = 'connected';
            } else {
                statusDiv.textContent = '未连接';
                statusDiv.className = 'disconnected';
            }
        }

        function connect() {
            userId = document.getElementById('userId').value;
            if (!userId) {
                alert('请输入用户ID');
                return;
            }

            if (ws) {
                addMessage('已经连接，请先断开');
                return;
            }

            ws = new WebSocket('ws://localhost:3102/ws');

            ws.onopen = function() {
                addMessage('WebSocket 连接成功');
                // 发送认证消息
                const authMsg = {
                    ver: 1,
                    op: 7,
                    body: JSON.stringify({ token: userId })
                };
                ws.send(JSON.stringify(authMsg));
            };

            ws.onmessage = function(event) {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };

            ws.onerror = function(error) {
                addMessage('WebSocket 错误: ' + error);
            };

            ws.onclose = function() {
                addMessage('WebSocket 连接关闭');
                updateStatus(false);
                stopHeartbeat();
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                stopHeartbeat();
            }
        }

        function handleMessage(msg) {
            switch (msg.op) {
                case 8: // 认证回复
                    const authReply = JSON.parse(msg.body);
                    if (authReply.code === 0) {
                        addMessage('认证成功: ' + authReply.msg);
                        updateStatus(true);
                        startHeartbeat();
                    } else {
                        addMessage('认证失败: ' + authReply.msg);
                    }
                    break;
                case 3: // 心跳回复
                    console.log('收到心跳回复');
                    break;
                case 5: // 消息推送
                    const pushMsg = JSON.parse(msg.body);
                    addMessage('收到消息: ' + pushMsg.content, 'received');
                    break;
                default:
                    addMessage('未知消息类型: ' + msg.op);
            }
        }

        function startHeartbeat() {
            heartbeatTimer = setInterval(function() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const heartbeatMsg = {
                        ver: 1,
                        op: 2,
                        body: ''
                    };
                    ws.send(JSON.stringify(heartbeatMsg));
                    console.log('发送心跳');
                }
            }, 30000); // 30秒一次
        }

        function stopHeartbeat() {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
        }
    </script>
</body>
</html>
